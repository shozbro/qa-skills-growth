<head>
<meta charset="utf-8">

<title>QA Skills Growth</title>
<style>
:root{--bg:#EEF1F4;--panel:#fff;--ink:#16222D;--muted:#586674;--line:#CBD3DB;--accent:#0B5FA5;--soft:#E2EEF8;--ok:#1B7A4B;--oksoft:#DFF1E7;--bad:#A8320B;--badsoft:#FBE3DA;--mono:ui-monospace,Consolas,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0E1419;--panel:#151D25;--ink:#E6EBF0;--muted:#93A1AF;--line:#2A3642;--accent:#5AB0F0;--soft:#16293A;--ok:#4CC38A;--oksoft:#14301F;--bad:#F0906A;--badsoft:#3A1F14}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,"Segoe UI",Roboto,sans-serif;padding:24px 16px 64px}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:clamp(26px,5vw,38px);line-height:1.1;margin:6px 0 4px}
h2{font-size:21px;margin:0 0 4px}
h3{font:600 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;margin-top:14px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
nav button,.btn{font:600 14px/1 inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:10px 14px;cursor:pointer}
nav button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{height:8px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);width:0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
th{font:600 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:0}
.scroll{overflow-x:auto}
a{color:var(--accent);overflow-wrap:anywhere}
.task{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:flex-start}
.task:first-child{border-top:0}
.task input{margin-top:4px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.task label{cursor:pointer}
.task input:checked+label .t{text-decoration:line-through;color:var(--muted)}
.date{display:block;font:12px/1.3 var(--mono);color:var(--muted)}
.tag{display:inline-block;font:500 11px/1 var(--mono);padding:3px 6px;border-radius:3px;background:var(--soft);color:var(--accent);margin-right:6px}
.tag.ok{background:var(--oksoft);color:var(--ok)}
.res{padding:8px 0;border-top:1px solid var(--line)}
.res:first-child{border-top:0}
.opt{display:block;width:100%;text-align:left;font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:11px 12px;margin-top:8px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--oksoft);border-color:var(--ok)}
.opt.wrong{background:var(--badsoft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:10px 12px;border-radius:4px;background:var(--soft)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-top:10px}
.row label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
select,input[type=number]{font:inherit;padding:9px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)}
.pass{color:var(--ok);font-weight:700}.retry{color:var(--bad);font-weight:700}
details{border-top:1px solid var(--line);padding:8px 0}
summary{cursor:pointer;font-weight:600}
[hidden]{display:none!important}
</style>
</head>

ests so each does not log in again", "Saving screenshots", "Cache cleaning"], "answer": 1, "why": "Log in once in setup, reuse the saved cookies and storage."}, {"q": "What does test.extend() do in Playwright Test?", "level": "advanced", "options": ["Extends timeouts", "Creates custom fixtures", "Adds browsers", "Runs tests twice"], "answer": 1, "why": "Custom fixtures give tests shared setup."}]}, "L3": {"skill": "L3", "name": "Troubleshooting, debugging and RCA", "learn": ["https://git-scm.com/docs/git-bisect"], "questions": [{"q": "What is the first step when a defect is reported?", "level": "beginner", "options": ["Fix the code", "Reproduce it reliably and note exact steps and environment", "Close it as cannot-reproduce", "Ask for a retest next sprint"], "answer": 1, "why": "No reliable repro, no reliable diagnosis."}, {"q": "Browser shows an error. Where do you look to see whether the API failed?", "level": "beginner", "options": ["Network tab status and response", "Elements tab", "Lighthouse tab", "Cookie settings"], "answer": 0, "why": "Network shows request, status code and payload."}, {"q": "Which is a root cause rather than a symptom?", "level": "intermediate", "options": ["The page shows 500", "The webhook handler skips records with a null Cms_Id", "The test failed", "Users complained"], "answer": 1, "why": "A root cause explains why the symptom occurs."}, {"q": "In the 5 Whys technique, you stop when:", "level": "intermediate", "options": ["You have asked 5 questions", "You reach a cause you can fix or control", "You find a person to blame", "The ticket is closed"], "answer": 1, "why": "The number five is a guide, not a rule."}, {"q": "What does git bisect help with?", "level": "intermediate", "options": ["Merging branches", "Finding the commit that introduced a regression", "Squashing commits", "Reviewing PRs"], "answer": 1, "why": "It binary-searches history between a good and a bad commit."}, {"q": "What is the difference between severity and priority?", "level": "beginner", "options": ["None", "Severity is impact of the defect; priority is how soon it should be fixed", "Severity is for developers only", "Priority is for QA only"], "answer": 1, "why": "A cosmetic bug on a launch page can be low severity but high priority."}, {"q": "Which of these belongs in a good bug report?", "level": "beginner", "options": ["Only a screenshot", "Steps to reproduce, expected vs actual result, environment", "The tester's opinion only", "Nothing else needed"], "answer": 1, "why": "It lets someone else reproduce it."}, {"q": "An API call returns HTTP 500. What does that usually suggest?", "level": "intermediate", "options": ["Client sent a bad request", "An error on the server side", "The page was not found", "The user is not logged in"], "answer": 1, "why": "4xx points to the client; 5xx to the server."}, {"q": "What is a correlation or trace ID useful for?", "level": "intermediate", "options": ["Styling", "Following one request across services and logs", "Encrypting data", "Counting users"], "answer": 1, "why": "It ties together the logs for the same request."}, {"q": "A test fails only intermittently. What is the best first move?", "level": "advanced", "options": ["Delete the test", "Compare passing and failing runs (data, timing, environment, order) before changing code", "Add random sleeps", "Rerun until green"], "answer": 1, "why": "Find the difference, then fix the cause."}, {"q": "A bug disappears when you add logging. What does that hint at?", "level": "advanced", "options": ["Logging fixes bugs", "A timing or race condition", "A CSS problem", "A typo"], "answer": 1, "why": "Logging changes timing, hiding a race."}, {"q": "What is the point of a blameless RCA?", "level": "advanced", "options": ["To find who to blame", "To fix process and system causes without blaming individuals", "To avoid writing anything down", "To speed up deploys"], "answer": 1, "why": "People report honestly when blame is removed."}]}, "L4": {"skill": "L4", "name": "Performance testing", "learn": ["https://grafana.com/docs/k6/latest/"], "questions": [{"q": "What does p95 response time mean?", "level": "intermediate", "options": ["The average time", "95% of requests were at or below this time", "The slowest request", "95 requests per second"], "answer": 1, "why": "It is a percentile, not an average."}, {"q": "Load testing vs stress testing:", "level": "beginner", "options": ["Same thing", "Load: expected traffic; stress: beyond capacity to find the breaking point", "Load: one user; stress: two users", "Stress: only on mobile"], "answer": 1, "why": "They answer different questions."}, {"q": "Throughput measures:", "level": "beginner", "options": ["Time per request", "Requests handled per unit time", "Memory use", "Error text"], "answer": 1, "why": "Latency is time per request; throughput is volume per time."}, {"q": "In k6, how do you make a run fail automatically when p95 is too slow?", "level": "intermediate", "options": ["Add thresholds in options", "Watch the console", "Use sleep()", "Lower the VUs"], "answer": 0, "why": "Thresholds define pass/fail criteria."}, {"q": "Why record a baseline before changes?", "level": "beginner", "options": ["To satisfy a template", "So later results can be compared against a known reference", "To reduce the load", "Baselines are optional and unused"], "answer": 1, "why": "Without a baseline you cannot tell if performance regressed."}, {"q": "What is a virtual user (VU)?", "level": "beginner", "options": ["A real customer", "A simulated concurrent user in a load test", "A server", "A test case"], "answer": 1, "why": "VUs run the script in parallel."}, {"q": "What is the purpose of ramp-up?", "level": "intermediate", "options": ["To warm coffee", "To increase load gradually so the system is not hit instantly", "To skip results", "To reduce errors in code"], "answer": 1, "why": "It makes problems easier to attribute."}, {"q": "Why can averages hide problems?", "level": "intermediate", "options": ["They are always wrong", "A few very slow requests barely move the mean but hurt real users", "They ignore errors", "They need more data"], "answer": 1, "why": "Look at percentiles like p95 and p99."}, {"q": "Why should the test environment resemble production?", "level": "intermediate", "options": ["It should not", "Results from very different hardware or data do not predict production", "To save money", "To avoid threshold checks"], "answer": 1, "why": "Data size and config affect performance."}, {"q": "What does a soak test look for?", "level": "advanced", "options": ["Maximum spike", "Problems that appear over long periods such as memory leaks", "Syntax errors", "UI bugs"], "answer": 1, "why": "It runs moderate load for hours."}, {"q": "How do you find the bottleneck during a load test?", "level": "advanced", "options": ["Guess", "Correlate response times with server metrics such as CPU, memory, database and connection pools", "Add more VUs only", "Read the code only"], "answer": 1, "why": "Client numbers show the symptom; server metrics show the cause."}, {"q": "What is coordinated omission?", "level": "advanced", "options": ["A reporting template", "A load generator that waits for a slow response and so under-records the latency users would have seen", "A kind of caching", "A security issue"], "answer": 1, "why": "It can make tail latencies look better than they are."}]}, "L5": {"skill": "L5", "name": "Mobile app testing and automation", "learn": ["https://appium.io/docs/en/latest/"], "questions": [{"q": "Appium drives apps using which protocol style?", "level": "intermediate", "options": ["WebDriver protocol", "SOAP", "GraphQL", "FTP"], "answer": 0, "why": "Appium extends the WebDriver protocol to mobile."}, {"q": "Which Appium driver targets Android?", "level": "intermediate", "options": ["XCUITest", "UiAutomator2", "Safari driver", "Gecko"], "answer": 1, "why": "XCUITest is for iOS."}, {"q": "Which locator is usually most stable on mobile?", "level": "intermediate", "options": ["Absolute XPath", "Accessibility id", "Screen coordinates", "Index of the 7th view"], "answer": 1, "why": "Accessibility ids are explicit and cross-platform friendly."}, {"q": "Which scenario is specific to mobile testing?", "level": "beginner", "options": ["Browser zoom", "Incoming call or notification during use", "Mouse hover", "Right click"], "answer": 1, "why": "Interruptions, permissions and background/foreground are mobile concerns."}, {"q": "Why test on real devices as well as emulators?", "level": "beginner", "options": ["Emulators are illegal", "Real devices expose hardware, performance and OEM differences", "Emulators cannot run apps", "It is cheaper"], "answer": 1, "why": "Emulators miss some real-world behaviour."}, {"q": "What are APK and IPA files?", "level": "beginner", "options": ["Test reports", "Android and iOS app packages", "Browsers", "Databases"], "answer": 1, "why": "APK for Android, IPA for iOS."}, {"q": "Which permission check belongs in mobile tests?", "level": "beginner", "options": ["None", "Allow and deny the permission prompt and confirm the app handles both", "Only allow", "Only deny"], "answer": 1, "why": "Users may refuse camera, location or notifications."}, {"q": "In Appium, what do capabilities/options define?", "level": "intermediate", "options": ["Test results", "The platform, device, app and automation driver for the session", "Colours", "Network speed"], "answer": 1, "why": "They tell the server what session to start."}, {"q": "What does adb devices show?", "level": "intermediate", "options": ["Installed apps", "Connected Android devices and emulators", "Network speed", "App logs"], "answer": 1, "why": "If your device is missing there, Appium cannot reach it."}, {"q": "What is Appium Inspector for?", "level": "advanced", "options": ["Running CI", "Inspecting the app's element tree to build locators", "Reporting bugs", "Profiling battery"], "answer": 1, "why": "It shows ids, accessibility labels and hierarchy."}, {"q": "Why plan an OS version and device matrix?", "level": "advanced", "options": ["It is optional", "Behaviour differs across OS versions, screen sizes and manufacturers", "To slow down testing", "Only iOS has it"], "answer": 1, "why": "Pick versions by your user analytics."}, {"q": "Which is the most reliable way to automate swipes and gestures on modern Appium?", "level": "advanced", "options": ["Pixel coordinates always", "W3C actions with element-relative positions where possible", "Sleep and tap", "Manual testing only"], "answer": 1, "why": "Coordinates break across screen sizes."}]}, "L6": {"skill": "L6", "name": "Penetration testing", "learn": ["https://owasp.org/www-project-top-ten/", "https://portswigger.net/web-security"], "questions": [{"q": "Which is on the OWASP Top 10 list?", "level": "beginner", "options": ["Broken Access Control", "Slow page load", "Typos", "Large images"], "answer": 0, "why": "Broken Access Control is a long-standing top category."}, {"q": "What best prevents SQL injection?", "level": "intermediate", "options": ["Hiding the form", "Parameterized queries", "Longer passwords", "Client-side validation only"], "answer": 1, "why": "Parameters keep data separate from SQL code."}, {"q": "IDOR (insecure direct object reference) means:", "level": "intermediate", "options": ["A user can access another user's object by changing an id", "A slow query", "A broken image", "A weak colour contrast"], "answer": 0, "why": "Authorization is not checked per object."}, {"q": "Before running a ZAP active scan you must:", "level": "beginner", "options": ["Nothing", "Have explicit permission and use an environment you are allowed to test", "Disable logging", "Run it on production"], "answer": 1, "why": "Unauthorized scanning can be illegal and can damage data."}, {"q": "What is OWASP ZAP primarily?", "level": "beginner", "options": ["A text editor", "An intercepting proxy and web security scanner", "A CI server", "A database"], "answer": 1, "why": "It sits between browser and app to inspect and attack-test traffic."}, {"q": "What is cross-site scripting (XSS)?", "level": "beginner", "options": ["Injecting scripts into pages that other users load", "A slow query", "A weak password", "A DNS record"], "answer": 0, "why": "Output encoding and CSP help prevent it."}, {"q": "What is CSRF?", "level": "intermediate", "options": ["Forcing a logged-in user's browser to send an unwanted request", "A database error", "A CSS framework", "A cache"], "answer": 0, "why": "Anti-CSRF tokens and SameSite cookies mitigate it."}, {"q": "What does a Content-Security-Policy header do?", "level": "intermediate", "options": ["Speeds up pages", "Restricts which sources scripts and other content may load from", "Encrypts the page", "Blocks cookies"], "answer": 1, "why": "It limits the impact of XSS."}, {"q": "Horizontal vs vertical privilege escalation:", "level": "intermediate", "options": ["Same", "Horizontal: access another user's data at the same level; vertical: gain higher privileges", "Horizontal: admin; vertical: user", "Only for databases"], "answer": 1, "why": "IDOR is typically horizontal."}, {"q": "What is SSRF?", "level": "advanced", "options": ["Tricking the server into making requests to internal or unintended targets", "A browser plugin", "A password policy", "A CDN"], "answer": 0, "why": "Cloud metadata endpoints are a classic target."}, {"q": "Why must a server verify JWT signatures and the expected algorithm?", "level": "advanced", "options": ["For speed", "Otherwise attackers can forge or alter tokens", "JWTs are always safe", "To save storage"], "answer": 1, "why": "Never trust unsigned or unexpected-alg tokens."}, {"q": "What helps reduce credential brute-forcing on login?", "level": "advanced", "options": ["Longer error messages", "Rate limiting, lockouts or MFA", "Showing which field is wrong", "Removing logs"], "answer": 1, "why": "Combine with monitoring."}]}}, "practical": {"L2": {"name": "Test estimations", "prompts": [["beginner", "List the steps you took on your last ticket and the time each took. Which step surprised you?"], ["intermediate", "Pick any ticket you tested this week. Write the estimate you would have given at the start and compare with the actual time. Explain the gap in two lines."], ["intermediate", "A new CMS entity needs UI, API and forward-sync coverage. List the work items you would size and why each could grow."], ["intermediate", "Break a 'test the new webhook' task into pieces and give an optimistic, likely and pessimistic estimate for each."], ["advanced", "A teammate asks for a one-day estimate on a task with unknown dependencies. Write your reply."], ["advanced", "Your estimates are consistently 30% low. Describe how you would find out why and what you would change."]], "criteria": "Pass: names the work items, states assumptions and risks, gives a range, and does not hide uncertainty."}, "L7": {"name": "Leadership", "prompts": [["beginner", "Write down three things you could teach a new joiner in 15 minutes."], ["intermediate", "Describe something you owned end to end in the last quarter: goal, decisions you made, what you delegated, result."], ["intermediate", "Prepare the outline for a 20-minute KT session you would give the team. Who is the audience and what should they be able to do afterwards?"], ["intermediate", "Two teammates disagree about the test approach. How do you help them reach a decision?"], ["advanced", "A teammate keeps missing handoffs. Write the conversation you would have."], ["advanced", "You must hand over the BTS automation to another engineer in two weeks. Write the handover plan and how you will know it worked."]], "criteria": "Pass: clear ownership, concrete decisions, a measurable outcome, and a respectful, specific message."}, "L8": {"name": "Problem solving, creativity, curiosity, innovation", "prompts": [["beginner", "Name one repetitive task you do weekly and how you could shorten it."], ["intermediate", "Describe a recurring QA pain point. Write it as problem, two options, your pick and the result."], ["intermediate", "Sketch a small tool that would save your team an hour a week. What does it do and how would you check it works?"], ["intermediate", "Pick a bug that took long to find. What would have found it sooner?"], ["advanced", "Pick something you do not understand in the BTS or CMS flow. Write three questions and how you would answer them."], ["advanced", "Propose an improvement to the team's test process. Include the problem, evidence, options, cost and how you would measure success."]], "criteria": "Pass: the problem is specific, options are compared, a decision is justified, and there is a way to check the result."}}}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function h(tag, props, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(props||{})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "href") { e.href = v; e.target = "_blank"; e.rel = "noopener"; }
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}
let ticks = {}; try { ticks = JSON.parse(store.get("qsg-ticks") || "{}"); } catch(e) {}
let hist = []; try { hist = JSON.parse(store.get("qsg-hist") || "[]"); } catch(e) {}
const fmt = iso => { if(!iso) return "no deadline"; const [y,m,d]=iso.split("-").map(Number); return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1]+" "+d+(y!==2026?", "+y:""); };
const tracks = D.tracks, later = D.later, banks = D.banks;
const dated = [...tracks.flatMap(t=>t.tasks.map(k=>k[0])), ...later.filter(l=>l.date).map(l=>l.id)];

function progress(){
  const done = dated.filter(id=>ticks[id]).length;
  document.getElementById("ptext").textContent = done+" of "+dated.length+" steps done";
  document.getElementById("pbar").style.width = Math.round(done/dated.length*100)+"%";
}
function tick(id, on){ ticks[id]=on; store.set("qsg-ticks", JSON.stringify(ticks)); progress(); }
function taskRow(id, date, text, extra){
  const cb = h("input",{type:"checkbox",id:"c-"+id,onchange:e=>tick(id,e.target.checked)});
  cb.checked = !!ticks[id];
  return h("div",{class:"task"}, cb, h("label",{for:"c-"+id}, h("span",{class:"date"}, (date?"by "+fmt(date):"no deadline")), h("span",{class:"t"}, text), extra||null));
}

const sections = {};
function startSection(){
  const rows = tracks.map((t,n)=>h("tr",{}, h("td",{},n+1), h("td",{}, h("a",{href:"#"+t.id,onclick:e=>{e.preventDefault();show(t.id)}}, t.id+": "+t.name)), h("td",{},fmt(t.due)), h("td",{}, h("a",{href:"#quiz",onclick:e=>{e.preventDefault();show("quiz",t.id)}},"Take quiz"))));
  const lrows = later.filter(l=>l.date).map((l,n)=>h("tr",{}, h("td",{},tracks.length+n+1), h("td",{}, h("a",{href:"#later",onclick:e=>{e.preventDefault();show("later")}}, l.id+": "+l.name)), h("td",{},fmt(l.date)), h("td",{}, banks[l.id] ? h("a",{href:"#quiz",onclick:e=>{e.preventDefault();show("quiz",l.id)}},"Take quiz") : "Practical prompts")));
  return h("section",{}, h("div",{class:"card"}, h("h2",{},"Order of study"),
    h("div",{class:"scroll"}, h("table",{}, h("thead",{}, h("tr",{}, h("th",{},"#"), h("th",{},"Skill"), h("th",{},"Finish by"), h("th",{},"Test"))), h("tbody",{}, rows, lrows))),
    h("p",{class:"muted"},"Parked after March: mobile testing, penetration testing. Ongoing, no deadline: leadership, problem solving. They are on the Later tab.")),
    h("div",{class:"card"}, h("h2",{},"Honest notes"), h("ul",{},
      h("li",{},"Questions were written by Claude as practice material, not an official exam. Check anything doubtful against the docs."),
      h("li",{},"Only the freeCodeCamp certification page, the Microsoft Learn GitHub Actions path and the Test Automation University press release were opened. Other links are standard docs sites that were not opened, so free status and certificates are unverified."),
      h("li",{},"Performance and Estimation aim for level 3 so the plan fits before March. Parking mobile and penetration testing was a prioritisation choice."))));
}
function trackSection(t){
  const lastTrackTasks = t.tasks.map(k=>taskRow(k[0],k[1],k[2]));
  const res = t.res.map(r=>h("div",{class:"res"}, h("a",{href:r[1]}, r[0]), h("div",{class:"muted"}, h("span",{class:"tag"+(r[3]==="page opened"?" ok":"")}, r[3]), r[2])));
  return h("section",{}, h("div",{class:"card"},
    h("h2",{}, "Track "+t.id+": "+t.name), h("div",{class:"muted"}, t.score+" · "+fmt(t.start)+" to "+fmt(t.due)),
    h("h3",{},"Steps"), lastTrackTasks,
    h("h3",{},"Where to learn (free)"), res,
    h("h3",{},"Done when"), h("p",{},t.done),
    h("p",{}, h("button",{class:"btn primary",onclick:()=>show("quiz",t.id)},"Take the Track "+t.id+" quiz"))));
}
function laterSection(){
  const rows = later.map(l=>taskRow(l.id,l.date,l.name+". "+l.text));
  const pr = Object.entries(D.practical).map(([k,v])=>h("details",{}, h("summary",{}, k+": "+v.name), h("ol",{}, v.prompts.map(p=>h("li",{}, h("span",{class:"tag"},p[0]), p[1]))), h("p",{class:"muted"}, v.criteria)));
  return h("section",{}, h("div",{class:"card"}, h("h2",{},"After the four tracks"), rows),
    h("div",{class:"card"}, h("h2",{},"Practical prompts"), h("p",{class:"muted"},"For skills that do not suit multiple choice. Write your answer in a note or file and compare it with the pass criteria."), pr));
}

// ---------- quiz
let Q = null;
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function quizSection(preset){
  const box = h("section",{});
  const render = () => { box.replaceChildren(Q ? (Q.i < Q.qs.length ? questionView() : resultView()) : setupView(preset)); };
  box._render = render; render(); return box;
}
function setupView(preset){
  const sk = h("select",{id:"qs"}, Object.entries(banks).map(([k,b])=>h("option",{value:k}, k+": "+b.name+" ("+b.questions.length+")")));
  if (preset && banks[preset]) sk.value = preset;
  const lv = h("select",{id:"ql"}, ["mixed","beginner","intermediate","advanced"].map(x=>h("option",{value:x},x)));
  const n = h("input",{type:"number",id:"qn",min:"1",max:"30",value:"8"});
  const go = h("button",{class:"btn primary",onclick:()=>{
    const b = banks[sk.value]; let pool = b.questions.filter(q=>lv.value==="mixed"||q.level===lv.value);
    if(!pool.length){ msg.textContent="No questions at that level."; return; }
    Q = {skill:sk.value, level:lv.value, bank:b, qs:shuffle(pool.slice()).slice(0, Math.max(1,Math.min(+n.value||8,pool.length))), i:0, right:0, missed:[], locked:false};
    sec.quiz._render();
  }},"Start");
  const msg = h("p",{class:"muted"});
  const hrows = hist.slice(-8).reverse().map(x=>h("tr",{}, h("td",{},x.d), h("td",{},x.skill+" "+x.level), h("td",{},x.right+"/"+x.total), h("td",{class:x.pass?"pass":"retry"}, x.pass?"PASS":"RETRY")));
  return h("div",{class:"card"}, h("h2",{},"Quiz"), h("p",{class:"muted"},"Pass mark is 70%. Options are shuffled each time. Missed questions show the reason and a study link."),
    h("div",{class:"row"}, h("label",{},"Skill",sk), h("label",{},"Level",lv), h("label",{},"Questions",n), go), msg,
    hist.length ? [h("h3",{},"Recent attempts (this browser)"), h("div",{class:"scroll"}, h("table",{}, h("tbody",{},hrows)))] : null,
    h("p",{class:"muted"},"L2, L7 and L8 have no multiple choice. Use the practical prompts on the Later tab."));
}
function questionView(){
  const q = Q.qs[Q.i]; const order = shuffle(q.options.map((t,idx)=>({t,idx})));
  const fb = h("div",{class:"fb",hidden:""}); const next = h("button",{class:"btn primary",hidden:"",onclick:()=>{Q.i++; Q.locked=false; sec.quiz._render();}}, Q.i+1===Q.qs.length?"See result":"Next");
  const btns = order.map(o=>h("button",{class:"opt",onclick:()=>{
    if(Q.locked) return; Q.locked=true;
    btns.forEach((b,k)=>{ b.disabled=true; if(order[k].idx===q.answer) b.classList.add("right"); });
    const ok = o.idx===q.answer;
    if(ok) Q.right++; else { Q.missed.push(q); btns[order.indexOf(o)].classList.add("wrong"); }
    fb.textContent = (ok?"Correct. ":"Not quite. ")+q.why; fb.hidden=false; next.hidden=false; next.focus();
  }}, o.t));
  return h("div",{class:"card"}, h("div",{class:"muted"}, Q.bank.skill+" · "+Q.level+" · question "+(Q.i+1)+" of "+Q.qs.length), h("h2",{style:"margin-top:8px"},q.q), btns, fb, h("p",{},next));
}
function resultView(){
  const pct = Math.round(Q.right/Q.qs.length*100), pass = pct>=70;
  hist.push({d:new Date().toISOString().slice(0,10), skill:Q.skill, level:Q.level, right:Q.right, total:Q.qs.length, pass}); store.set("qsg-hist", JSON.stringify(hist.slice(-50)));
  const learn = (Q.bank.learn||[]).map(u=>h("li",{},h("a",{href:u},u)));
  return h("div",{class:"card"}, h("h2",{},Q.skill+": "+Q.right+"/"+Q.qs.length+" ("+pct+"%) ", h("span",{class:pass?"pass":"retry"}, pass?"PASS":"RETRY")),
    Q.missed.length ? [h("h3",{},"Missed"), h("ul",{}, Q.missed.map(m=>h("li",{}, h("b",{},m.q), h("div",{}, "Correct: "+m.options[m.answer]), h("div",{class:"muted"}, m.why))))] : h("p",{},"No misses."),
    Q.missed.length&&learn.length ? [h("h3",{},"Study"), h("ul",{},learn)] : null,
    h("p",{}, h("button",{class:"btn primary",onclick:()=>{const s=Q.skill; Q=null; show("quiz",s);}},"Another round")));
}

// ---------- shell
const sec = {};
const tabs = [["start","Start"], ...tracks.map(t=>[t.id,t.id+" "+t.short]), ["later","Later"], ["quiz","Quiz"]];
function show(id, preset){
  if (!tabs.some(t=>t[0]===id)) id="start";
  if (id!=="quiz") Q=Q; // keep a running quiz
  const main = document.getElementById("main");
  let el;
  if (id==="start") el = startSection();
  else if (id==="later") el = laterSection();
  else if (id==="quiz") { el = sec.quiz = quizSection(preset); }
  else el = trackSection(tracks.find(t=>t.id===id));
  main.replaceChildren(el);
  document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-current", b.dataset.id===id ? "true" : "false"));
  try{ history.replaceState(null,"","#"+id); }catch(e){}
  window.scrollTo(0,0);
}
document.getElementById("nav").append(...tabs.map(t=>h("button",{"data-id":t[0],onclick:()=>show(t[0])},t[1])));
progress();
show(location.hash.slice(1) || "start");
</script>
</body>
